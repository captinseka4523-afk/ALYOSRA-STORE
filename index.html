<div class="side-menu-overlay" id="sideMenuOverlay"></div>


<aside class="side-menu" id="sideMenu">

        <span>القائمة</span>

</li>

    </ul>

<main class="container">


    <img 
    src="images/LOGO.png"
    alt="AL YOSRA LOGO"
    class="main-logo">



    <h1>
        AL YOSRA STORE
    </h1>



    <p id="message">
        متجر اليُسرى الإلكتروني
    </p>




    <a href="products.html" class="shop-button">

        إبدأ التسوق الآن

    </a>



</main>



<script src="js/cart-count.js"></script>

<script>

    const menuToggle =
        document.getElementById("menuToggle");

    const sideMenu =
        document.getElementById("sideMenu");

    const sideMenuClose =
        document.getElementById("sideMenuClose");

            const sideMenuOverlay =
    document.getElementById("sideMenuOverlay");


  menuToggle.addEventListener(
    "click",
    () => {

        sideMenu.classList.add("open");
        sideMenuOverlay.classList.add("open");

    }
);


sideMenuClose.addEventListener(
    "click",
    () => {

        sideMenu.classList.remove("open");
        sideMenuOverlay.classList.remove("open");

    }
);

sideMenuOverlay.addEventListener(
    "click",
    () => {

        sideMenu.classList.remove("open");
        sideMenuOverlay.classList.remove("open");

    }
);



</script>
