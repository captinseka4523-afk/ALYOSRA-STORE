<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إدارة العروض - متجر اليُسرى</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <div class="admin-container">


        <header class="admin-header">

            <h1>
                إدارة العروض
            </h1>

            <a
                href="admin-dashboard.html"
                class="admin-back-btn"
            >
                العودة إلى لوحة التحكم
            </a>

        </header>



        <main class="admin-content">


            <section class="admin-card">

                <h2>
                    إضافة عرض جديد
                </h2>


                <form id="offerForm">


                    <div class="form-group">

                        <label for="offerName">
                            اسم العرض
                        </label>

                        <input
                            type="text"
                            id="offerName"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="offerDescription">
                            وصف العرض
                        </label>

                        <textarea
                            id="offerDescription"
                            rows="4"
                        ></textarea>

                    </div>



                    <div class="form-group">

                        <label for="offerPrice">
                            سعر العرض بالدولار
                        </label>

                        <input
                            type="number"
                            id="offerPrice"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="offerImage">
                            رابط صورة العرض
                        </label>

                        <input
                            type="text"
                            id="offerImage"
                            placeholder="https://..."
                        >

                    </div>



                    <div class="form-group">

                        <label>
                            المنتجات الموجودة في العرض
                        </label>


                        <div
                            id="productsList"
                            class="offer-products-list"
                        >

                            جاري تحميل المنتجات...

                        </div>

                    </div>



                    <button
                        type="submit"
                        class="admin-btn"
                    >
                        إضافة العرض
                    </button>


                </form>

            </section>



            <section class="admin-card">

                <h2>
                    العروض الحالية
                </h2>


                <div id="offersList">

                    جاري تحميل العروض...

                </div>

            </section>


        </main>


    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase-client.js"></script>

    <script src="js/admin-auth.js"></script>

    <script src="js/admin-offers.js"></script>


</body>

</html>
