<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

   <link rel="icon" type="image/png" href="/images/LOGO.png">


<meta property="og:type" content="website">

<meta property="og:title"
      content="AL YOSRA STORE — أدوات ومستلزمات طب الأسنان">

<meta property="og:description"
      content="">

<meta property="og:image"
     content="https://alyosra-store.netlify.app/images/og-image.png">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:site_name"
      content="AL YOSRA STORE">

<meta property="og:locale"
      content="ar_AR">



<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:title"
      content="AL YOSRA STORE — أدوات ومستلزمات طب الأسنان">

<meta name="twitter:description"
      content="">

<meta name="twitter:image"
   content="https://alyosra-store.netlify.app/images/og-image.png">




<meta name="description"
      content="اطلع على تفاصيل عروض AL YOSRA STORE واستفد من العروض المتاحة على أدوات ومستلزمات طب الأسنان.">

    <title>تفاصيل العرض - متجر اليُسرى</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/offers.css"
    >

    <link
        rel="stylesheet"
        href="css/offer-details.css"
    >

</head>


<body>


<main class="offer-details-page">


    <!-- =========================================
         شريط التنقل الخاص بالصفحة
    ========================================== -->

    <div class="offer-details-navigation">

        <a
            href="offers.html"
            class="offer-navigation-button offer-navigation-back"
        >
            <span class="offer-navigation-icon">←</span>
            <span>العودة إلى العروض</span>
        </a>


        <a
            href="products.html"
            class="offer-navigation-button"
        >
            <span class="offer-navigation-icon">⌕</span>
            <span>تصفح المنتجات</span>
        </a>


        <a
            href="cart.html"
            class="offer-navigation-button offer-navigation-cart"
        >
            <span class="offer-navigation-icon">🛒</span>
            <span>الذهاب إلى السلة</span>
        </a>

    </div>



    <!-- =========================================
         المحتوى الرئيسي
    ========================================== -->

    <section
        id="offerDetails"
        class="offer-details-container"
        aria-live="polite"
    >

        <div class="offer-details-loading">

            <div class="offer-loading-shimmer offer-loading-image"></div>

            <div class="offer-loading-content">

                <div class="offer-loading-line offer-loading-small"></div>

                <div class="offer-loading-line offer-loading-title"></div>

                <div class="offer-loading-line"></div>

                <div class="offer-loading-line offer-loading-medium"></div>

                <div class="offer-loading-price"></div>

                <div class="offer-loading-button"></div>

            </div>

        </div>

    </section>


</main>



<!-- =========================================
     رسالة نجاح الإضافة إلى السلة
========================================== -->

<div
    id="offerToast"
    class="offer-toast"
    aria-live="polite"
    role="status"
>

    <span class="offer-toast-icon">
        ✓
    </span>

    <span id="offerToastText">
        تمت إضافة العرض إلى السلة
    </span>

</div>



<!-- =========================================
     Supabase
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="js/supabase-client.js"></script>

<script src="js/cart-count.js"></script>


<script src="js/offer-details.js"></script>



</body>

</html>
