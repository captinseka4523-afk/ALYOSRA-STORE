<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إدارة العروض - متجر اليُسرى</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >
    <link
        rel="stylesheet"
        href="css/admin-offers.css"
    >

</head>


<body>


    <div class="admin-container">


        <header class="admin-header">

            <h1>
                إدارة العروض
            </h1>

            <a
                href="admin-dashboard.html"
                class="admin-back-btn"
            >
                العودة إلى لوحة التحكم
            </a>

        </header>



        <main class="admin-content">


            <section class="admin-card">

                <h2>
                    إضافة عرض جديد
                </h2>


                <form id="offerForm">


                    <div class="form-group">

                        <label for="offerName">
                            اسم العرض
                        </label>

                        <input
                            type="text"
                            id="offerName"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="offerDescription">
                            وصف العرض
                        </label>

                        <textarea
                            id="offerDescription"
                            rows="4"
                        ></textarea>

                    </div>



                    <div class="form-group">

                        <label for="offerPrice">
                            سعر العرض بالدولار
                        </label>

                        <input
                            type="number"
                            id="offerPrice"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>

<div class="form-group">

    <label for="offerQuantity">
        كمية العرض
    </label>

    <input
        type="number"
        id="offerQuantity"
        min="0"
        step="1"
        required
    >

</div>

                 <div class="form-group">

    <label for="offerImageFile">
        صورة العرض
    </label>

    <input
        id="offerImageFile"
        type="file"
        accept="image/jpeg,image/png,image/webp"
    >

    <div
        id="offerImagePreview"
        class="admin-offer-image-preview"
        hidden
    >
        <img
            id="offerImagePreviewImage"
            src=""
            alt="معاينة صورة العرض"
        >
    </div>

    <small
        id="offerImageStatus"
        class="admin-form-help"
    >
        اختر صورة من جهازك. سيتم تحسينها ورفعها تلقائيًا عند حفظ العرض.
    </small>

</div>



                    <div class="form-group">

                        <label>
                            المنتجات الموجودة في العرض
                        </label>


                        <div
                            id="productsList"
                            class="offer-products-list"
                        >

                            جاري تحميل المنتجات...

                        </div>

                    </div>



                    <button
                        type="submit"
                        class="admin-btn"
                    >
                        إضافة العرض
                    </button>


                </form>

            </section>



            <section class="admin-card">

                <h2>
                    العروض الحالية
                </h2>


                <div id="offersList">

                    جاري تحميل العروض...

                </div>

            </section>
<!-- ================================= -->
<!-- Offer Edit Modal -->
<!-- ================================= -->

<div
    id="offerEditModal"
    class="offer-edit-modal"
    hidden
>

    <div class="offer-edit-modal-box">

        <div class="offer-edit-header">

            <h2>
                تعديل العرض
            </h2>

            <button
                type="button"
                id="closeOfferEditModal"
                class="offer-edit-close"
            >
                ×
            </button>

        </div>


        <form id="offerEditForm">

            <input
                type="hidden"
                id="editOfferId"
            >


            <div class="form-group">

                <label for="editOfferName">
                    اسم العرض
                </label>

                <input
                    type="text"
                    id="editOfferName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="editOfferDescription">
                    وصف العرض
                </label>

                <textarea
                    id="editOfferDescription"
                    rows="4"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="editOfferPrice">
                    سعر العرض بالدولار
                </label>

                <input
                    type="number"
                    id="editOfferPrice"
                    min="0"
                    step="0.01"
                    required
                >

            </div>

            <div class="form-group">
    <label for="editOfferQuantity">
        كمية العرض
    </label>

    <input
        type="number"
        id="editOfferQuantity"
        min="0"
        step="1"
        required
    >
</div>



        <div class="form-group">

    <label for="editOfferImageFile">
        صورة العرض
    </label>

    <input
        id="editOfferImageFile"
        type="file"
        accept="image/jpeg,image/png,image/webp"
    >

    <div
        id="editOfferImagePreview"
        class="admin-offer-image-preview"
        hidden
    >
        <img
            id="editOfferImagePreviewImage"
            src=""
            alt="معاينة صورة العرض"
        >
    </div>

    <small
        id="editOfferImageStatus"
        class="admin-form-help"
    >
        إذا لم تختر صورة جديدة، ستبقى الصورة الحالية كما هي.
    </small>

</div>


            <div class="form-group">

                <label>
                    منتجات العرض
                </label>

                <div
                    id="editOfferProductsList"
                    class="offer-products-list"
                >
                    جاري تحميل المنتجات...
                </div>

            </div>


            <div
                id="offerEditMessage"
                class="offer-edit-message"
            ></div>


            <div class="offer-edit-actions">

                <button
                    type="button"
                    id="cancelOfferEdit"
                    class="admin-secondary-button"
                >
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="admin-btn"
                >
                    حفظ التعديلات
                </button>

            </div>

        </form>

    </div>

</div>

        </main>


    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase-client.js"></script>

    <script src="js/admin-auth.js"></script>

    <script src="js/admin-offers.js"></script>


</body>

</html>
