    <main class="container offers-page">

        <h1>
            العروض
        </h1>


        <p>
            استفد من عروض وباقات متجر اليُسرى
        </p>


        <div id="offersContainer">

            جاري تحميل العروض...

        </div>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase-client.js"></script>

    <script src="js/cart-count.js"></script>


    <script>

        const menuToggle =
            document.getElementById("menuToggle");

        const sideMenu =
            document.getElementById("sideMenu");

        const sideMenuClose =
            document.getElementById("sideMenuClose");

        const sideMenuOverlay =
            document.getElementById("sideMenuOverlay");


        menuToggle.addEventListener(
            "click",
            () => {

                sideMenu.classList.add("open");
                sideMenuOverlay.classList.add("open");

            }
        );


        sideMenuClose.addEventListener(
            "click",
            () => {

                sideMenu.classList.remove("open");
                sideMenuOverlay.classList.remove("open");

            }
        );


        sideMenuOverlay.addEventListener(
            "click",
            () => {

                sideMenu.classList.remove("open");
                sideMenuOverlay.classList.remove("open");

            }
        );

    </script>



    <script>

        const offersContainer =
            document.getElementById("offersContainer");


        async function loadOffers() {

            const {
                data,
                error
            } = await supabaseClient
                .from("offers")
                .select(`
                    id,
                    name,
                    description,
                    price,
                    image,
                    active,
                    offer_items (
                        quantity,
                        products (
                            name
                        )
                    )
                `)
                .eq(
                    "active",
                    true
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(error);

                offersContainer.textContent =
                    "حدث خطأ أثناء تحميل العروض.";

                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                offersContainer.textContent =
                    "لا توجد عروض حاليًا.";

                return;

            }


            offersContainer.innerHTML = "";


            data.forEach(
                (offer) => {

                   const card =
    document.createElement("div");

card.className =
    "offer-card";

card.style.cursor =
    "pointer";

card.addEventListener(
    "click",
    () => {

        window.location.href =
            `offer-details.html?id=${offer.id}`;

    }
);

                


                    const productsText =
                        (offer.offer_items || [])
                            .map(
                                (item) =>
                                    `${item.products?.name || "منتج"} × ${item.quantity}`
                            )
                            .join("، ");


                   card.innerHTML = `

    ${
        offer.image
            ? `
                <img
                    src="${offer.image}"
                    alt="${offer.name}"
                    class="offer-image"
                >
              `
            : ""
    }


    <div class="offer-content">

        <h2>
            ${offer.name}
        </h2>


        <div class="offer-price">

            $${Number(
                offer.price
            ).toFixed(2)}

        </div>

    </div>

`;


                    offersContainer.appendChild(card);

                }
            );

        }


        loadOffers();

    </script>
